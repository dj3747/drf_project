name: CI/CD
on:
  push:
    branches: [ "feature/homework" ]
  pull_request:
    branches: [ "feature/homework" ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: drf
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: Akoros781
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.13

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies with Poetry
        run: |
          poetry install --no-root

      - name: Install redis-tools for redis-cli
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-tools

      - name: Run migrations
        env:
          DB_NAME: drf
          DB_USER: postgres
          DB_PASSWORD: Akoros781
          DB_HOST: localhost
          DB_PORT: 5432
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_DB: 0
          DEBUG: True
        run: |
          poetry run python manage.py migrate

      - name: Run tests
        env:
          DB_NAME: drf
          DB_USER: postgres
          DB_PASSWORD: Akoros781
          DB_HOST: localhost
          DB_PORT: 5432
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_DB: 0
          DEBUG: True
        run: |
          poetry run python manage.py test

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/feature/homework'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/drf-project:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/drf-project:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: [ test, build-and-push ]
    # Убедитесь, что это условие правильное для вашего рабочего процесса.
    # Возможно, вы захотите деплоить на production, когда мержите в main, или по тегу.
    if: github.ref == 'refs/heads/feature/homework'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy to Yandex Cloud VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22 # Укажите, если SSH работает не на 22 порту
          # Передача переменных окружения, которые нужны на сервере
          # Если они есть в .env файле на сервере, эти переменные могут быть избыточны,
          # но безопасно передать секреты никогда не повредит.
          env: |
            DB_NAME=${{ env.DB_NAME }} # Использовать переменные из предыдущего job'а, если они там определены
            DB_USER=${{ env.DB_USER }}
            DB_PASSWORD=${{ env.DB_PASSWORD }}
            DB_HOST=db # Имя сервиса в docker-compose.yml на сервере
            DB_PORT=5432
            STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
            STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}
            CELERY_BROKER_URL=redis://redis:6379/0
            CELERY_RESULT_BACKEND=redis://redis:6379/0
            REDIS_HOST=redis
            REDIS_PORT=6379
            REDIS_DB=0
            DEBUG=False
            ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            CSRF_TRUSTED_ORIGINS=${{ secrets.CSRF_TRUSTED_ORIGINS }}
            DOCKER_HUB_USERNAME=${{ secrets.DOCKER_HUB_USERNAME }}
            DOCKER_HUB_ACCESS_TOKEN=${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
            IMAGE_NAME=${{ secrets.DOCKER_IMAGE_NAME }} # Например, 'yourdockerhubusername/drf-project'

          script: |
            set -x # Включить вывод команд для отладки
            
            # Переходим в директорию проекта на сервере
            cd ${{ secrets.DEPLOY_DIR }}
            
            # Создаем .env файл с переменными окружения
            # Убедитесь, что вы передаете все нужные переменные!
            cat << 'EOF' > .env
            DB_NAME=${{ env.DB_NAME }}
            DB_USER=${{ env.DB_USER }}
            DB_PASSWORD=${{ env.DB_PASSWORD }}
            DB_HOST=db
            DB_PORT=5432
            STRIPE_SECRET_KEY=${{ env.STRIPE_SECRET_KEY }}
            STRIPE_PUBLISHABLE_KEY=${{ env.STRIPE_PUBLISHABLE_KEY }}
            CELERY_BROKER_URL=redis://redis:6379/0
            CELERY_RESULT_BACKEND=redis://redis:6379/0
            REDIS_HOST=redis
            REDIS_PORT=6379
            REDIS_DB=0
            DEBUG=False
            ALLOWED_HOSTS=${{ env.ALLOWED_HOSTS }}
            SECRET_KEY=${{ env.SECRET_KEY }}
            CSRF_TRUSTED_ORIGINS=${{ env.CSRF_TRUSTED_ORIGINS }}
            EOF
            
            # Login to Docker Hub
            echo ${{ env.DOCKER_HUB_ACCESS_TOKEN }} | docker login -u ${{ env.DOCKER_HUB_USERNAME }} --password-stdin
            
            # Stop old containers
            docker compose down || true
            
            # Pull latest images
            # Убедитесь, что тег образа соответствует вашему workflow build-and-push
            docker pull ${{ env.IMAGE_NAME }}:latest 
            # Или используйте тег на основе SHA коммита, если он передается
            
            # Start containers
            docker compose up -d
            
            # Run migrations
            docker compose exec web python manage.py migrate
            
            # Collect static files
            docker compose exec web python manage.py collectstatic --noinput
            
            # Restart application
            docker compose restart web