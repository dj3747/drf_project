name: CI/CD
on:
  push:
    branches: [ "feature/homework" ]
  pull_request:
    branches: [ "feature/homework" ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: drf
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: Akoros781
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.13

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies with Poetry
        run: |
          poetry install --no-root

      - name: Install redis-tools for redis-cli
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-tools

      - name: Run migrations
        env:
          DB_NAME: drf
          DB_USER: postgres
          DB_PASSWORD: Akoros781
          DB_HOST: localhost
          DB_PORT: 5432
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_DB: 0
          DEBUG: True
        run: |
          poetry run python manage.py migrate

      - name: Run tests
        env:
          DB_NAME: drf
          DB_USER: postgres
          DB_PASSWORD: Akoros781
          DB_HOST: localhost
          DB_PORT: 5432
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_DB: 0
          DEBUG: True
        run: |
          poetry run python manage.py test

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/feature/homework'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/drf-project:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/drf-project:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: [ test, build-and-push ] # Зависит от тестов и сборки/пуша образа
    if: github.ref == 'refs/heads/feature/homework'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # --- ШАГ 1: Копирование docker-compose.yaml на сервер ---
      - name: Copy docker-compose.yaml to server
        # Укажите конкретную стабильную версию, например, v1.0.0
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: 22
          SOURCE: ./docker-compose.yaml
          TARGET: ${{ secrets.DEPLOY_DIR }}/docker-compose.yaml
          # STRIP_SPOOFING: true # <-- Удалено

      # --- ШАГ 2: Копирование nginx.conf на сервер ---
      - name: Copy nginx.conf to server
        # Используйте ту же версию, что и выше
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: 22
          SOURCE: ./nginx.conf
          TARGET: ${{ secrets.DEPLOY_DIR }}/nginx.conf
          # STRIP_SPOOFING: true # <-- Удалено
      # --- ШАГ 3: Выполнение команд развертывания на сервере ---
      - name: Execute deploy script on Yandex Cloud VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          request_pty: true
          port: 22
          # Добавляем переменную окружения, которая будет доступна в script:
          environment_vars: |
            DEPLOY_DIR_ON_SERVER={{ secrets.DEPLOY_DIR }}
          script: |
            set -x # Включить вывод команд для отладки

            # Используем переменную, которую мы передали из workflow
            # Теперь DEPLOY_DIR_ON_SERVER будет содержать реальный путь, например, /var/www/drf_project
            echo "Deploying to directory: $DEPLOY_DIR_ON_SERVER"
            cd "$DEPLOY_DIR_ON_SERVER"

            # Проверка существования директории и прав доступа (на всякий случай)
            if [ ! -d "$DEPLOY_DIR_ON_SERVER" ]; then
              echo "Error: Deployment directory '$DEPLOY_DIR_ON_SERVER' does not exist."
              exit 1
            fi
            if [ ! -w "$DEPLOY_DIR_ON_SERVER" ]; then
              echo "Error: Deployment directory '$DEPLOY_DIR_ON_SERVER' is not writable for user '$(whoami)'."
              exit 1
            fi

            # Создаем .env файл с переменными окружения
            cat << 'EOF' > .env
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_HOST=db
            DB_PORT=5432
            STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
            STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}
            CELERY_BROKER_URL=redis://redis:6379/0
            CELERY_RESULT_BACKEND=redis://redis:6379/0
            REDIS_HOST=redis
            REDIS_PORT=6379
            REDIS_DB=0
            DEBUG=False
            ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            DOCKER_HUB_USERNAME=${{ secrets.DOCKER_HUB_USERNAME }}
            DOCKER_HUB_ACCESS_TOKEN=${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
            IMAGE_NAME=${{ secrets.DOCKER_HUB_USERNAME }}/drf-project
            EOF

            # Login to Docker Hub
            echo "${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin

            # Stop old containers
            docker compose down || true

            # Pull latest images
            docker pull "${{ env.IMAGE_NAME }}:latest"
            docker pull nginx:latest

            # Start containers
            docker compose up -d

            # Run migrations
            docker compose exec web python manage.py migrate

            # Collect static files
            docker compose exec web python manage.py collectstatic --noinput

            # Restart application
            docker compose restart web