name: CI/CD
on:
  push:
    branches: [ "feature/homework" ]
  pull_request:
    branches: [ "feature/homework" ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: drf
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: Akoros781
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.13

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies with Poetry
        run: |
          poetry install --no-root

      - name: Install redis-tools for redis-cli
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-tools

      - name: Run migrations
        env:
          DB_NAME: drf
          DB_USER: postgres
          DB_PASSWORD: Akoros781
          DB_HOST: localhost
          DB_PORT: 5432
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_DB: 0
          DEBUG: True
        run: |
          poetry run python manage.py migrate

      - name: Run tests
        env:
          DB_NAME: drf
          DB_USER: postgres
          DB_PASSWORD: Akoros781
          DB_HOST: localhost
          DB_PORT: 5432
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_DB: 0
          DEBUG: True
        run: |
          poetry run python manage.py test


  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/feature/homework'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          environment_vars: |
            DEPLOY_DIR_ON_SERVER={{ secrets.DEPLOY_DIR }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            # STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }} # Раскомментируйте, если используете
            # ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }} # Раскомментируйте, если используете
          script: |
            set -x

            # --- СОЗДАНИЕ docker-compose.yaml НА СЕРВЕРЕ ---
            # !!! ВСТАВЬТЕ СОДЕРЖИМОЕ ВАШЕГО ЛОКАЛЬНОГО docker-compose.yaml СЮДА !!!
            # !!! Убедитесь, что Dockerfile находится в корне проекта НА СЕРВЕРЕ !!!
            cat << 'EOF' > docker-compose.yaml
            version: '3.8'

            services:
              web:
                build: .
                container_name: drf_web
                ports:
                  - "8000:8000"
                volumes:
                  - static_volume:/app/static
                  - media_volume:/app/media
                env_file:
                  - .env
                depends_on:
                  - postgres
                  - redis
              postgres:
                image: postgres:15
                container_name: drf_postgres
                volumes:
                  - postgres_data:/var/lib/postgresql/data/
                environment:
                  POSTGRES_DB: $DB_NAME
                  POSTGRES_USER: $DB_USER
                  POSTGRES_PASSWORD: $DB_PASSWORD
              redis:
                image: redis:7-alpine
                container_name: drf_redis
                volumes:
                  - redis_data:/data
              nginx:
                image: nginx:latest
                container_name: drf_nginx
                ports:
                  - "80:80"
                volumes:
                  - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
                depends_on:
                  - web
                restart: always
            volumes:
              postgres_data:
              redis_data:
              static_volume:
              media_volume:
            EOF
            # --- КОНЕЦ СОЗДАНИЯ docker-compose.yaml ---

            # --- СОЗДАНИЕ nginx.conf НА СЕРВЕРЕ ---
            # !!! ВСТАВЬТЕ СОДЕРЖИМОЕ ВАШЕГО ЛОКАЛЬНОГО nginx.conf СЮДА !!!
            cat << 'EOF' > nginx.conf
            events {
                worker_connections 1024;
            }

            http {
                include       /etc/nginx/mime.types;
                default_type  application/octet-stream;
                sendfile        on;
                keepalive_timeout 65;

                server {
                    listen 80;
                    location / {
                        proxy_pass http://web:8000;
                        proxy_set_header Host $host;
                        proxy_set_header X-Real-IP $remote_addr;
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                        proxy_set_header X-Forwarded-Proto $scheme;
                    }
                }
            }
            EOF
            # --- КОНЕЦ СОЗДАНИЯ nginx.conf ---

            # --- СОЗДАНИЕ .env ФАЙЛА НА СЕРВЕРЕ ---
            echo "--- Creating .env file on server ---"
            cat << 'EOF' > .env
            DB_NAME=$DB_NAME
            DB_USER=$DB_USER
            DB_PASSWORD=$DB_PASSWORD
            DB_HOST=postgres
            DB_PORT=5432
            SECRET_KEY=$SECRET_KEY
            # STRIPE_SECRET_KEY=$STRIPE_SECRET_KEY
            # STRIPE_PUBLISHABLE_KEY=$STRIPE_PUBLISHABLE_KEY
            CELERY_BROKER_URL=redis://redis:6379/0
            CELERY_RESULT_BACKEND=redis://redis:6379/0
            REDIS_HOST=redis
            REDIS_PORT=6379
            REDIS_DB=0
            DEBUG=False
            ALLOWED_HOSTS=$ALLOWED_HOSTS
            # CSRF_TRUSTED_ORIGINS=$CSRF_TRUSTED_ORIGINS
            EOF
            # --- КОНЕЦ СОЗДАНИЯ .env ФАЙЛА ---

            # --- Ваши команды ---
            echo "--- Navigating to deployment directory ---"
            cd "$DEPLOY_DIR_ON_SERVER"
            echo "Current directory: $(pwd)"

            echo "Stopping containers..."
            docker compose down
            
            echo "Rebuilding and starting containers..."
            docker compose up -d --build
            
            echo "Running migrations and collecting static..."
            docker compose exec web python manage.py migrate
            docker compose exec web python manage.py collectstatic --noinput

            echo "Deploy finished"